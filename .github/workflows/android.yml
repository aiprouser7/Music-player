name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build release APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/home/user/app" \
            -w /home/user/app \
            kivy/buildozer \
            -c 'set -euo pipefail;
            apt-get update; apt-get install -y curl unzip;
            export ANDROID_SDK_ROOT=/home/user/app/.buildozer/android/platform/android-sdk;
            export ANDROID_HOME="$ANDROID_SDK_ROOT";
            export ANDROIDSDK="$ANDROID_SDK_ROOT";
            mkdir -p "$ANDROID_SDK_ROOT";

            SDKMANAGER=$(command -v sdkmanager || true);
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_SDK_ROOT" /opt /usr /home -path "*/cmdline-tools/*/bin/sdkmanager" -type f 2>/dev/null | head -n 1);
            fi;

            if [ -z "$SDKMANAGER" ]; then
              echo "Downloading Android cmdline-tools...";
              TMP_TOOLS="$ANDROID_SDK_ROOT/cmdline-tools-tmp";
              mkdir -p "$TMP_TOOLS";
              curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$TMP_TOOLS/tools.zip";
              unzip -q "$TMP_TOOLS/tools.zip" -d "$TMP_TOOLS";
              mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools";
              mv "$TMP_TOOLS/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest";
              rm -rf "$TMP_TOOLS";
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager";
            fi;

            export PATH="$PATH:$(dirname "$SDKMANAGER")";

            set +o pipefail;
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-33" \
              "build-tools;33.0.2" "build-tools;36.0.0";
            SDK_EXIT=${PIPESTATUS[1]};
            set -o pipefail;
            if [ "$SDK_EXIT" -ne 0 ]; then
              exit "$SDK_EXIT";
            fi;

            pip install --upgrade pip;
            buildozer android release'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubeloader-apk
          path: bin/*.apk
