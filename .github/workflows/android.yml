name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build release APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/home/user/app" \
            -w /home/user/app \
            kivy/buildozer \
            -c 'set -e;
            export ANDROID_SDK_ROOT=/home/user/app/.buildozer/android/platform/android-sdk;
            export ANDROID_HOME="$ANDROID_SDK_ROOT";
            export ANDROIDSDK="$ANDROID_SDK_ROOT";
            mkdir -p "$ANDROID_SDK_ROOT";

            SDKMANAGER=$(command -v sdkmanager || true);
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER=$(find /opt /usr /home -path "*/cmdline-tools/*/bin/sdkmanager" -type f 2>/dev/null | head -n 1);
            fi;

            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found" >&2;
              exit 1;
            fi;

            export PATH="$PATH:$(dirname "$SDKMANAGER")";

            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-33" "build-tools;33.0.2";

            pip install --upgrade pip;
            buildozer android release'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubeloader-apk
          path: bin/*.apk
