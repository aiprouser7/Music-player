name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build release APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/home/user/app" \
            -w /home/user/app \
            kivy/buildozer \
            -c "export ANDROID_SDK_ROOT=/opt/android && export PATH=\"$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin\" && yes | sdkmanager 'platforms;android-33' 'build-tools;33.0.2' && pip install --upgrade pip && buildozer android release"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubeloader-apk
          path: bin/*.apk
